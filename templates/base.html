<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#2c3e50">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spackenkill Website{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/static/sw.js")
      .then(reg => console.log("SW registered:", reg.scope))
      .catch(err => console.log("SW failed:", err));
  });
}
</script>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
            <img src="/static/Logo.jpg" alt="School Logo">
            <h1>Spackenkill High School</h1>
        </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}class="active"{% endif %}>Home</a></li>
                <li><a href="{{ url_for('courses') }}" {% if request.endpoint == 'courses' %}class="active"{% endif %}>Course Selector</a></li>
                <li><a href="{{ url_for('clubs') }}" {% if request.endpoint == 'clubs' %}class="active"{% endif %}>School Clubs</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
